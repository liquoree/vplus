name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build production Docker image
        env:
          NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}
          NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_YANDEX_MAPS_API_KEY=$NEXT_PUBLIC_YANDEX_MAPS_API_KEY" \
            --build-arg "NEXT_PUBLIC_CAPTCHA_SITE_KEY=$NEXT_PUBLIC_CAPTCHA_SITE_KEY" \
            --tag vplus-frontend:ci \
            .

      - name: Start production image
        run: |
          docker run \
            --detach \
            --name vplus-frontend-ci \
            --publish 3000:3000 \
            vplus-frontend:ci

      - name: Check application startup
        run: |
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/privacy \
              > /dev/null
            then
              exit 0
            fi

            if [ "$(docker inspect \
              --format '{{.State.Running}}' \
              vplus-frontend-ci)" != "true" ]
            then
              echo "Frontend container stopped unexpectedly."
              docker logs vplus-frontend-ci
              exit 1
            fi

            sleep 1
          done

          echo "Frontend did not become ready."
          docker logs vplus-frontend-ci
          exit 1

      - name: Stop production image
        if: always()
        run: |
          docker rm \
            --force \
            vplus-frontend-ci \
            2>/dev/null || true

      - name: Set GHCR image name
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY}"
          IMAGE_NAME="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag \
            vplus-frontend:ci \
            "$IMAGE_NAME:$GITHUB_SHA"

          docker tag \
            vplus-frontend:ci \
            "$IMAGE_NAME:master"

          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:master"